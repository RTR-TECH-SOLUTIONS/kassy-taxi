name: Publicare demo pe GitHub Pages

# Site-ul real rulează pe taxi-ludus.ro (Enhance, publicat din GitHub, vezi DEPLOY.md). Workflow-ul ține doar demo-ul
# de pe https://demo.mrwebsites.ro/kassy-taxi/: alt site/base, cu noindex pe pagini și robots.txt care interzice indexarea
# (ambele puse de Layout.astro și src/pages/robots.txt.ts când site-ul stă într-un subfolder).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://demo.mrwebsites.ro
          SITE_BASE: /kassy-taxi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
